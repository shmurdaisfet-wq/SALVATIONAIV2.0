<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" async onerror="console.warn('Leaflet CDN blocked - map unavailable')"></script>
<style>
    body { background-color: #0a0a0a; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    #navbar { display: flex; flex-wrap: wrap; background-color: #111111; padding: 10px; gap: 8px; }
    .navbtn { background-color: #1a1a2e; color: #ffffff; border: 1px solid #0077ff; padding: 12px 16px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    #mainScreen { padding: 20px; color: #ffffff; font-size: 16px; }
    .critical { color: #ff0000; font-size: 32px; font-weight: bold; }
    .section-title-red { color: #ff0000; font-weight: bold; margin-bottom: 5px; }
    .section-title-blue { color: #0077ff; font-weight: bold; margin-bottom: 5px; }
    .section-title-amber { color: #ffaa00; font-weight: bold; margin-bottom: 5px; }
    .section-title-green { color: #00ff00; font-weight: bold; margin-bottom: 5px; }
    .section-text { color: #cccccc; font-size: 15px; margin-bottom: 20px; }
    .incident-title { color: #ffffff; font-size: 20px; font-weight: bold; margin: 5px 0; }
    .incident-label { color: #ff0000; font-size: 13px; margin: 0; }
    .incident-header { border-left: 4px solid #ff0000; padding-left: 15px; margin-bottom: 20px; }
    .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .feed-card { background: #111111; border: 1px solid #333333; border-radius: 6px; overflow: hidden; cursor: pointer; }
    .feed-card:hover { border-color: #0077ff; }
    .feed-card.maximized { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; border-radius: 0; display: flex; flex-direction: column; }
    .feed-screen { background: #000000; height: 120px; display: flex; align-items: center; justify-content: center; position: relative; }
    .feed-card.maximized .feed-screen { flex: 1; height: auto; }
    .feed-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .feed-label { padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; }
    .feed-name { color: #ffffff; font-size: 12px; font-weight: bold; }
    .feed-info { color: #aaaaaa; font-size: 10px; }

    /* -- SYSTEMS MONITOR -- */
    .sys-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .sys-title { color: #0077ff; font-size: 18px; font-weight: bold; }
    .sys-timestamp { color: #555555; font-size: 11px; font-family: monospace; }
    .sys-section-label {
        color: #555555; font-size: 10px; font-weight: bold; letter-spacing: 2px;
        text-transform: uppercase; margin: 16px 0 8px 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px;
    }
    .sys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sys-card {
        background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 6px;
        padding: 10px 12px; position: relative; overflow: hidden;
    }
    .sys-card::before {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px; border-radius: 3px 0 0 3px;
    }
    .sys-card.ok::before { background: #00ff00; }
    .sys-card.warn::before { background: #ffaa00; }
    .sys-card.critical::before { background: #ff0000; }
    .sys-card.offline::before { background: #444444; }
    .sys-card-name { color: #aaaaaa; font-size: 10px; font-weight: bold; letter-spacing: 1px; margin: 0 0 4px 0; }
    .sys-card-value { color: #ffffff; font-size: 18px; font-weight: bold; margin: 0; line-height: 1; }
    .sys-card-sub { color: #555555; font-size: 10px; margin: 3px 0 6px 0; }
    .sys-bar-track { background: #1a1a1a; border-radius: 2px; height: 4px; width: 100%; }
    .sys-bar-fill { height: 4px; border-radius: 2px; transition: width 1s ease; }
    .sys-bar-fill.ok { background: #00ff00; }
    .sys-bar-fill.warn { background: #ffaa00; }
    .sys-bar-fill.critical { background: #ff0000; }
    .sys-status-badge {
        display: inline-block; font-size: 9px; font-weight: bold; padding: 2px 6px;
        border-radius: 3px; letter-spacing: 1px; margin-top: 4px;
    }
    .sys-status-badge.ok { background: #001a00; color: #00ff00; border: 1px solid #004400; }
    .sys-status-badge.warn { background: #1a1000; color: #ffaa00; border: 1px solid #443300; }
    .sys-status-badge.critical { background: #1a0000; color: #ff0000; border: 1px solid #440000; }
    .sys-status-badge.offline { background: #111111; color: #555555; border: 1px solid #333333; }
    .sys-alert-bar {
        background: #1a0000; border: 1px solid #440000; border-radius: 6px;
        padding: 8px 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .sys-alert-bar.warn { background: #1a1000; border-color: #443300; }
    .sys-alert-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff0000; animation: pulse-dot 1s infinite; flex-shrink: 0; }
    .sys-alert-dot.warn { background: #ffaa00; animation: none; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes alarm-flash { 0%{opacity:1} 100%{opacity:0.7} }
    .sys-alert-text { color: #ff4444; font-size: 11px; font-weight: bold; }
    .sys-alert-text.warn { color: #ffaa00; }
    .sys-vehicle-card {
        background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 6px;
        padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px;
    }
    .sys-vehicle-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
    .sys-vehicle-info { flex: 1; }
    .sys-vehicle-name { color: #ffffff; font-size: 13px; font-weight: bold; margin: 0 0 2px 0; }
    .sys-vehicle-type { color: #555555; font-size: 10px; margin: 0 0 4px 0; }
    .sys-vehicle-metrics { display: flex; gap: 10px; }
    .sys-metric { text-align: center; }
    .sys-metric-val { color: #ffffff; font-size: 12px; font-weight: bold; display: block; }
    .sys-metric-lbl { color: #555555; font-size: 9px; letter-spacing: 1px; }

    /* -- INCIDENT LOG -- */
    .log-section-label {
        color: #555555; font-size: 10px; font-weight: bold; letter-spacing: 2px;
        text-transform: uppercase; margin: 14px 0 8px 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px;
    }
    .ilog-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .ilog-filter-btn { background: #111111; border: 1px solid #333333; color: #aaaaaa; font-size: 10px; font-weight: bold; padding: 5px 10px; border-radius: 4px; cursor: pointer; letter-spacing: 1px; }
    .ilog-filter-btn.active { color: #ffffff; }
    .ilog-filter-btn.all.active     { border-color: #0077ff; color: #0077ff; background: #001133; }
    .ilog-filter-btn.medical.active  { border-color: #ff4444; color: #ff4444; background: #1a0000; }
    .ilog-filter-btn.tactical.active { border-color: #ffaa00; color: #ffaa00; background: #1a1000; }
    .ilog-filter-btn.comms.active    { border-color: #00aaff; color: #00aaff; background: #001a2e; }
    .ilog-filter-btn.system.active   { border-color: #00ff00; color: #00ff00; background: #001a00; }
    .ilog-timeline { position: relative; padding-left: 20px; }
    .ilog-timeline::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: #1e1e1e; }
    .ilog-entry { position: relative; margin-bottom: 10px; }
    .ilog-dot { position: absolute; left: -18px; top: 4px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid; }
    .ilog-dot.medical  { background: #1a0000; border-color: #ff4444; }
    .ilog-dot.tactical { background: #1a1000; border-color: #ffaa00; }
    .ilog-dot.comms    { background: #001a2e; border-color: #00aaff; }
    .ilog-dot.system   { background: #001a00; border-color: #00ff00; }
    .ilog-dot.manual   { background: #1a001a; border-color: #cc44ff; }
    .ilog-card { background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 6px; padding: 8px 10px; }
    .ilog-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .ilog-card-time { color: #444444; font-size: 10px; font-family: monospace; }
    .ilog-card-cat { font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 3px; letter-spacing: 1px; }
    .ilog-card-cat.medical  { background: #1a0000; color: #ff4444; border: 1px solid #440000; }
    .ilog-card-cat.tactical { background: #1a1000; color: #ffaa00; border: 1px solid #443300; }
    .ilog-card-cat.comms    { background: #001a2e; color: #00aaff; border: 1px solid #003366; }
    .ilog-card-cat.system   { background: #001a00; color: #00ff00; border: 1px solid #004400; }
    .ilog-card-cat.manual   { background: #1a001a; color: #cc44ff; border: 1px solid #440044; }
    .ilog-card-who { color: #666666; font-size: 10px; margin-bottom: 3px; }
    .ilog-card-text { color: #cccccc; font-size: 12px; line-height: 1.4; }
    .ilog-add-box { background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 6px; padding: 12px; margin-top: 6px; }
    .ilog-add-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .ilog-select { background: #1a1a1a; border: 1px solid #333333; color: #ffffff; font-size: 12px; padding: 6px 8px; border-radius: 4px; flex: 1; min-width: 100px; }
    .ilog-textarea { background: #1a1a1a; border: 1px solid #333333; color: #ffffff; font-size: 12px; padding: 8px 10px; border-radius: 4px; width: 100%; box-sizing: border-box; resize: none; font-family: monospace; }
    .ilog-textarea:focus { outline: none; border-color: #0077ff; }
    .btn-log-entry { background: #00001a; border: 1px solid #0077ff; color: #0077ff; font-size: 12px; font-weight: bold; padding: 8px 16px; border-radius: 4px; cursor: pointer; letter-spacing: 1px; width: 100%; }
    .btn-log-entry:active { background: #000033; }

    /* -- COMMUNICATIONS -- */
    .comms-section-label {
        color: #555555; font-size: 10px; font-weight: bold; letter-spacing: 2px;
        text-transform: uppercase; margin: 14px 0 8px 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 4px;
    }
    .ch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px; }
    .ch-card {
        background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 6px;
        padding: 10px 12px; position: relative; cursor: pointer; transition: border-color 0.2s;
    }
    .ch-card:hover { border-color: #0077ff; }
    .ch-card.active { border-color: #00ff00; background: #001a00; }
    .ch-card.busy  { border-color: #ff0000; background: #1a0000; }
    .ch-card.idle  { border-color: #1e1e1e; }
    .ch-card.squelch { border-color: #ffaa00; background: #1a1000; }
    .ch-name { color: #ffffff; font-size: 12px; font-weight: bold; margin: 0 0 2px 0; }
    .ch-freq { color: #555555; font-size: 10px; font-family: monospace; margin: 0 0 6px 0; }
    .ch-sig-track { background: #1a1a1a; border-radius: 2px; height: 3px; width: 100%; margin-bottom: 4px; }
    .ch-sig-fill  { height: 3px; border-radius: 2px; transition: width 1.5s ease; }
    .ch-sig-fill.strong { background: #00ff00; }
    .ch-sig-fill.medium { background: #ffaa00; }
    .ch-sig-fill.weak   { background: #ff4444; }
    .ch-meta { display: flex; justify-content: space-between; align-items: center; }
    .ch-status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .ch-status-txt { font-size: 9px; font-weight: bold; letter-spacing: 1px; }
    .ch-enc { color: #0077ff; font-size: 9px; }

    .comms-log { background: #0a0a0a; border: 1px solid #1e1e1e; border-radius: 6px; padding: 8px; max-height: 220px; overflow-y: auto; }
    .log-entry { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #111111; }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: #444444; font-size: 10px; font-family: monospace; flex-shrink: 0; padding-top: 1px; }
    .log-caller { font-size: 11px; font-weight: bold; flex-shrink: 0; min-width: 70px; }
    .log-text { color: #cccccc; font-size: 11px; line-height: 1.4; }
    .log-ch { color: #333333; font-size: 9px; flex-shrink: 0; padding-top: 2px; }
    .log-entry.incoming .log-caller { color: #0077ff; }
    .log-entry.outgoing .log-caller { color: #00ff00; }
    .log-entry.priority .log-caller { color: #ff4444; }

    .broadcast-box { background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 6px; padding: 12px; margin-top: 6px; }
    .broadcast-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .broadcast-select {
        background: #1a1a1a; border: 1px solid #333333; color: #ffffff;
        font-size: 12px; padding: 6px 8px; border-radius: 4px; flex: 1; min-width: 100px;
    }
    .broadcast-input {
        background: #1a1a1a; border: 1px solid #333333; color: #ffffff;
        font-size: 12px; padding: 8px 10px; border-radius: 4px; width: 100%; box-sizing: border-box;
        font-family: monospace; resize: none;
    }
    .broadcast-input:focus { outline: none; border-color: #0077ff; }
    .btn-transmit {
        background: #003300; border: 1px solid #00ff00; color: #00ff00;
        font-size: 12px; font-weight: bold; padding: 8px 16px; border-radius: 4px;
        cursor: pointer; letter-spacing: 1px; width: 100%;
    }
    .btn-transmit:active { background: #005500; }
    .btn-transmit.transmitting { background: #005500; animation: tx-pulse 0.5s infinite; }
    @keyframes tx-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .ptt-btn {
        background: #1a0000; border: 2px solid #ff0000; color: #ff4444;
        font-size: 13px; font-weight: bold; padding: 12px; border-radius: 6px;
        cursor: pointer; letter-spacing: 2px; text-align: center; margin-top: 6px;
        user-select: none;
    }
    .ptt-btn:active, .ptt-btn.held { background: #440000; border-color: #ff6666; color: #ffffff; }
</style>
</head>
<body>

<div id="navbar">
    <button class="navbtn" onclick="showScreen('Map')">Map</button>
    <button class="navbtn" onclick="showScreen('Briefing')">Briefing</button>
    <button class="navbtn" onclick="showScreen('Video Feed')">Video Feed</button>
    <button class="navbtn" onclick="showScreen('Systems Monitor')">Systems</button>
    <button class="navbtn" onclick="showScreen('Threat Alerts')">Threats</button>
    <button class="navbtn" onclick="showScreen('Communications')">Comms</button>
    <button class="navbtn" onclick="showScreen('Resources')">Resources</button>
    <button class="navbtn" onclick="showScreen('Incident Log')">Log</button>
    <button class="navbtn" onclick="showScreen('Crew Status')">Crew</button>
</div>

<div id="mainScreen">Welcome to SALVATION AI. Select a screen.</div>

<script>

// -- SYSTEMS MONITOR STATE --
var sysInterval = null;
var sysData = {
    // Main vehicle systems
    fuel:        { value: 78,  unit: '%',  label: 'FUEL LEVEL',      sub: 'Main tank',          bar: true,  warn: 25,  crit: 10  },
    battery:     { value: 91,  unit: '%',  label: 'MAIN BATTERY',    sub: 'Aux power bank',     bar: true,  warn: 30,  crit: 15  },
    engine_temp: { value: 87,  unit: 'degC', label: 'ENGINE TEMP',     sub: 'Normal: 70-95degC',    bar: false, warn: 100, crit: 110, invert: true },
    coolant:     { value: 94,  unit: '%',  label: 'COOLANT LEVEL',   sub: 'Radiator reservoir', bar: true,  warn: 40,  crit: 20  },
    oil:         { value: 72,  unit: '%',  label: 'OIL PRESSURE',    sub: 'PSI normalized',     bar: true,  warn: 30,  crit: 15  },
    speed:       { value: 0,   unit: 'km/h',label: 'VEHICLE SPEED',  sub: 'GPS ground speed',   bar: false, warn: 999, crit: 999 },
    // Comms & electronics
    gps:         { value: 97,  unit: '%',  label: 'GPS SIGNAL',      sub: '9 satellites locked',bar: true,  warn: 50,  crit: 20  },
    comms:       { value: 84,  unit: '%',  label: 'COMMS UPLINK',    sub: 'Encrypted channel',  bar: true,  warn: 40,  crit: 20  },
    power_inv:   { value: 99,  unit: '%',  label: 'POWER INVERTER',  sub: '12V -> 240V onboard', bar: true,  warn: 60,  crit: 30  },
    data_link:   { value: 61,  unit: '%',  label: 'DATA LINK',       sub: 'LTE / Satellite',    bar: true,  warn: 30,  crit: 15  },
};

var equipData = {
    defib:   { label: 'DEFIBRILLATOR',    icon: '\u2764\uFE0F',  status: 'ok',      note: 'Charged * Ready'          },
    o2:      { label: 'OXYGEN SUPPLY',    icon: '\uD83E\uDEC1',  status: 'warn',    note: '38% remaining'            },
    trauma:  { label: 'TRAUMA KIT',       icon: '\uD83E\uDE79',  status: 'ok',      note: 'Fully stocked'            },
    stretcher:{ label: 'STRETCHER',       icon: '\uD83D\uDECF\uFE0F',  status: 'ok',      note: 'Deployed on rails'        },
    rope:    { label: 'RESCUE ROPE',      icon: '\uD83E\uDEA2',  status: 'ok',      note: '30m * Rigged'             },
    harness: { label: 'HARNESS SET',      icon: '\uD83E\uDDBA',  status: 'ok',      note: '4x units * Checked'       },
    saw:     { label: 'HYDRAULIC SAW',    icon: '\uD83D\uDD27',  status: 'ok',      note: 'Fueled * Ready'           },
    fire_ext:{ label: 'FIRE SUPPRESSOR',  icon: '\uD83E\uDDEF',  status: 'ok',      note: '2x full cylinders'        },
    nvg:     { label: 'NIGHT VISION',     icon: '\uD83D\uDC41\uFE0F',  status: 'warn',    note: 'Battery low - 22%'        },
    comms_hh:{ label: 'HANDHELD RADIOS',  icon: '\uD83D\uDCFB',  status: 'ok',      note: '6x units * Encrypted'     },
    flare:   { label: 'FLARE KIT',        icon: '\uD83D\uDD34',  status: 'ok',      note: '8x flares * Dry stored'   },
    water_pump:{ label: 'WATER PUMP',     icon: '\uD83D\uDCA7', status: 'ok',      note: 'Primed * 50L/min'         },
};

var vehicleData = [
    { name: 'RAVEN',   type: 'Helicopter',  icon: '\uD83D\uDE81', fuel: 82, battery: 95, status: 'ok',      statusText: 'STANDBY' },
    { name: 'GHOST',   type: 'Hypercar',    icon: '\uD83D\uDE97', fuel: 91, battery: 99, status: 'ok',      statusText: 'STANDBY' },
    { name: 'VIPER',   type: 'Stunt Bike',  icon: '\uD83C\uDFCD\uFE0F', fuel: 55, battery: 88, status: 'warn',    statusText: 'FUEL LOW' },
    { name: 'TITAN',   type: 'ATV',         icon: '\uD83D\uDE99', fuel: 70, battery: 94, status: 'ok',      statusText: 'STANDBY' },
    { name: 'EYE ONE', type: 'Drone',       icon: '\uD83D\uDEF8', fuel: 0,  battery: 100,status: 'ok',      statusText: 'STANDBY' },
    { name: 'EYE TWO', type: 'Drone',       icon: '\uD83D\uDEF8', fuel: 0,  battery: 47, status: 'warn',    statusText: 'DEPLOYED * LOW BAT' },
];

function getSysClass(key, value) {
    var d = sysData[key];
    if (d.invert) {
        if (value >= d.crit) return 'critical';
        if (value >= d.warn) return 'warn';
        return 'ok';
    }
    if (value <= d.crit) return 'critical';
    if (value <= d.warn) return 'warn';
    return 'ok';
}

function getBarClass(key, value) { return getSysClass(key, value); }

function getBarPct(key, value) {
    var d = sysData[key];
    if (d.invert) {
        // scale 0-120degC for engine temp
        return Math.min(100, Math.round((value / 120) * 100));
    }
    return Math.min(100, value);
}

function nudge(val, min, max, step) {
    var delta = (Math.random() - 0.5) * step;
    return Math.min(max, Math.max(min, Math.round((val + delta) * 10) / 10));
}

function tickSysData() {
    sysData.fuel.value        = nudge(sysData.fuel.value,        10, 100, 0.3);
    sysData.battery.value     = nudge(sysData.battery.value,     10, 100, 0.5);
    sysData.engine_temp.value = nudge(sysData.engine_temp.value, 70, 115, 1.5);
    sysData.coolant.value     = nudge(sysData.coolant.value,     10, 100, 0.2);
    sysData.oil.value         = nudge(sysData.oil.value,         10, 100, 0.5);
    sysData.gps.value         = nudge(sysData.gps.value,         20, 100, 1.0);
    sysData.comms.value       = nudge(sysData.comms.value,       20, 100, 2.0);
    sysData.power_inv.value   = nudge(sysData.power_inv.value,   50, 100, 0.3);
    sysData.data_link.value   = nudge(sysData.data_link.value,   10, 100, 3.0);
    for (var i = 0; i < vehicleData.length; i++) {
        var v = vehicleData[i];
        v.battery = nudge(v.battery, 5, 100, 0.8);
        if (v.fuel > 0) v.fuel = nudge(v.fuel, 5, 100, 0.4);
        v.status = (v.battery < 30 || (v.fuel > 0 && v.fuel < 20)) ? 'critical'
                 : (v.battery < 50 || (v.fuel > 0 && v.fuel < 40)) ? 'warn' : 'ok';
    }
    renderSysScreen();
}

function renderSysCard(key) {
    var d = sysData[key];
    var val = d.value;
    var cls = getSysClass(key, val);
    var display = Math.round(val * 10) / 10;
    var html = "<div class='sys-card " + cls + "' id='sc_" + key + "'>";
    html += "<p class='sys-card-name'>" + d.label + "</p>";
    html += "<p class='sys-card-value'>" + display + "<span style='font-size:11px; color:#555555; margin-left:2px;'>" + d.unit + "</span></p>";
    html += "<p class='sys-card-sub'>" + d.sub + "</p>";
    if (d.bar) {
        var pct = getBarPct(key, val);

function renderSysScreen() {

        else if (cls === 'warn')     alerts.push({ text: sysData[k].label + ' WARNING - ' + Math.round(sysData[k].value) + sysData[k].unit, level: 'warn' });

function getSigClass(sig) {
    if (sig >= 70) return 'strong';
    if (sig >= 45) return 'medium';
    return 'weak';
}

function getChStatusColor(status) {
    if (status === 'active')  return '#00ff00';
    if (status === 'busy')    return '#ff4444';
    if (status === 'squelch') return '#ffaa00';
    return '#444444';
}

function getChStatusLabel(status) {
    if (status === 'active')  return 'ACTIVE';
    if (status === 'busy')    return 'BUSY';
    if (status === 'squelch') return 'SQUELCH';
    return 'IDLE';
}

function renderChannel(ch, idx) {
    var col    = getChStatusColor(ch.status);
    var label  = getChStatusLabel(ch.status);
    var sigCls = getSigClass(ch.signal);
    var chNum  = 'CH' + (idx + 1);
    return "<div class='ch-card " + ch.status + "' onclick='selectChannel(\"" + chNum + "\")'>" +
        "<p class='ch-name'>" + ch.name + "</p>" +
        "<p class='ch-freq'>" + ch.freq + (ch.enc ? " \uD83D\uDD12" : "") + "</p>" +
        "<div class='ch-sig-track'><div class='ch-sig-fill " + sigCls + "' style='width:" + Math.round(ch.signal) + "%'></div></div>" +
        "<div class='ch-meta'>" +

            "<span class='ch-status-txt' style='color:" + col + ";'>" + label + (ch.party ? " \u2022 " + ch.party : "") + "</span></span>" +

        var idx  = Math.floor(Math.random() * channels.length);

            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = freq;
            o.type = 'square';
            g.gain.setValueAtTime(0.3, ctx.currentTime + start);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
            o.start(ctx.currentTime + start);
            o.stop(ctx.currentTime + start + dur + 0.05);
        };
        beep(880, 0,    0.18);
        beep(660, 0.22, 0.18);
        beep(880, 0.44, 0.18);
        beep(660, 0.66, 0.18);
        beep(880, 0.88, 0.35);
    } catch(e) {}
    setTimeout(function(){ alarmActive = false; }, 3000);
}

function severityColor(sev) {
    if (sev === 'critical') return '#ff0000';
    if (sev === 'high')     return '#ffaa00';
    return '#0077ff';
}

function typeIcon(type) {
    var icons = { fire:'\uD83D\uDD25', flood:'\uD83C\uDF0A', accident:'\uD83D\uDE97', medical:'\uD83C\uDFE5', crime:'\uD83D\uDEA8', structural:'\uD83C\uDFD7\uFE0F', hazmat:'\u2622\uFE0F', other:'\u26A0\uFE0F' };
    return icons[type] || '\u26A0\uFE0F';
}

// Poll Supabase for new unacknowledged incidents
function pollIncidents() {
    fetch(SUPABASE_URL + '/rest/v1/incidents?acknowledged=eq.false&order=timestamp.desc&limit=1', {
        headers: {
            'apikey':        SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
        }
    })
    .then(function(r){ return r.json(); })
    .then(function(data) {
        if (!data || data.length === 0) return;
        var incident = data[0];
        if (incident.id === lastSeenId) return;
        lastSeenId    = incident.id;
        activeIncident = incident;
        triggerAlarm();
        showAlarmBanner(incident);
        if (document.getElementById('mainScreen').dataset.screen === 'Briefing') {
            renderBriefingScreen();
        }
    })
    .catch(function(e){ console.warn('Poll error:', e); });
}

function showAlarmBanner(incident) {
    var existing = document.getElementById('alarm_banner');
    if (existing) existing.remove();
    var col = severityColor(incident.severity);
    var banner = document.createElement('div');
    banner.id = 'alarm_banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;width:100%;z-index:9999;background:#1a0000;border-bottom:2px solid ' + col + ';padding:10px 16px;display:flex;align-items:center;gap:10px;animation:alarm-flash 0.5s infinite alternate;';
    banner.innerHTML = '<span style="font-size:20px;animation:pulse-dot 0.5s infinite;">' + typeIcon(incident.type) + '</span>' +
        '<div style="flex:1;">' +
            '<p style="color:' + col + ';font-weight:bold;font-size:13px;margin:0;letter-spacing:1px;">\u26A0 NEW INCIDENT - ' + incident.severity.toUpperCase() + '</p>' +
            '<p style="color:#cccccc;font-size:12px;margin:2px 0 0 0;">' + incident.type.toUpperCase() + ' \u00B7 ' + incident.location + '</p>' +
        '</div>' +
        '<button onclick="dismissAlarm()" style="background:#330000;border:1px solid #660000;color:#ff4444;font-size:11px;font-weight:bold;padding:6px 12px;border-radius:4px;cursor:pointer;letter-spacing:1px;">VIEW</button>';
    banner.querySelector('button').addEventListener('click', function(){ showScreen('Briefing'); });
    document.body.insertBefore(banner, document.body.firstChild);
    setTimeout(dismissAlarm, 15000);
}

function dismissAlarm() {
    var b = document.getElementById('alarm_banner');
    if (b) b.remove();
}

function acknowledgeIncident() {
    if (!activeIncident) return;
    fetch(SUPABASE_URL + '/rest/v1/incidents?id=eq.' + activeIncident.id, {
        method: 'PATCH',
        headers: {
            'Content-Type':  'application/json',
            'apikey':        SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Prefer':        'return=minimal'
        },
        body: JSON.stringify({ acknowledged: true })
    });
    dismissAlarm();
}

// Generate AI briefing from incident data
function generateAIBriefing(incident) {
    var briefEl = document.getElementById('briefing_content');
    if (!briefEl) return;
    briefEl.innerHTML = '<p style="color:#555555;font-size:13px;text-align:center;padding:20px 0;">\u23F3 SALVATION AI is generating briefing...</p>';

    var prompt = [
        'You are SALVATION AI, the autonomous emergency intelligence system for a private rapid response vehicle in Ghana.',
        'A WatchGhana field reporter has submitted the following incident report:',
        '',
        'TYPE: ' + incident.type.toUpperCase(),
        'SEVERITY: ' + incident.severity.toUpperCase(),
        'LOCATION: ' + incident.location,
        'DESCRIPTION: ' + incident.description,
        'VICTIMS: ' + incident.victims,
        'SERVICES ON SCENE: ' + (incident.services_on_scene || 'none'),
        'ACCESS ROUTE: ' + (incident.access_route || 'unknown'),
        'REPORTED BY: ' + incident.reporter + ' (' + incident.reporter_id + ')',
        'TIME: ' + incident.timestamp,
        '',
        'Generate a concise crew briefing with exactly these four sections. Use plain text, no markdown, no bullet points:',
        '',
        'SITUATION: [2-3 sentences describing what is happening]',
        'THREATS: [2-3 sentences on immediate dangers to crew and victims]',
        'RECOMMENDED ACTION: [2-3 sentences on what the crew should do]',
        'INACTION RISK: [1-2 sentences on consequences of delayed response]'
    ].join('\n');

    fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{ role: 'user', content: prompt }]
        })
    })
    .then(function(r){ return r.json(); })
    .then(function(data) {
        var text = data.content && data.content[0] ? data.content[0].text : '';
        if (!text) { briefEl.innerHTML = '<p style="color:#ff4444;">Failed to generate briefing.</p>'; return; }

        // Parse sections
        function extractSection(label, next) {
            var re = new RegExp(label + ':\s*([\s\S]*?)(?=' + next + ':|$)', 'i');
            var m  = text.match(re);
            return m ? m[1].trim() : '';
        }
        var situation = extractSection('SITUATION',  'THREATS');
        var threats   = extractSection('THREATS',    'RECOMMENDED ACTION');
        var action    = extractSection('RECOMMENDED ACTION', 'INACTION RISK');
        var inaction  = extractSection('INACTION RISK', '$$END$$');

        briefEl.innerHTML =
            "<p class='section-title-blue'>SITUATION</p><p class='section-text'>" + situation + "</p>" +
            "<p class='section-title-amber'>THREATS</p><p class='section-text'>" + threats + "</p>" +
            "<p class='section-title-green'>RECOMMENDED ACTION</p><p class='section-text'>" + action + "</p>" +
            "<p class='section-title-red'>INACTION RISK</p><p class='section-text'>" + inaction + "</p>" +
            "<button onclick='acknowledgeIncident()' style='margin-top:10px;width:100%;background:#001a00;border:1px solid #00ff00;color:#00ff00;font-size:12px;font-weight:bold;padding:10px;border-radius:6px;cursor:pointer;letter-spacing:2px;'>OK ACKNOWLEDGE & CLEAR</button>";
    })
    .catch(function(e) {
        briefEl.innerHTML = '<p style="color:#ff4444;">AI briefing unavailable. Check connection.</p>';
        console.error('AI briefing error:', e);
    });
}
